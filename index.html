<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Portfolio v9.2</title>
<style>body{font-family:-apple-system;background:#f3f4f6;padding:20px}.card{background:#fff;padding:24px;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.05)}.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input{border:1px solid #d1d5db;border-radius:8px;padding:8px 10px}input.api{width:320px;font-family:monospace}button{padding:9px 16px;border:none;border-radius:8px;color:#fff;font-weight:600;cursor:pointer}.run{background:#2563eb}.add{background:#059669}.reset{background:#6b7280}.summary{margin:14px 0;padding:14px;background:#f8fafc;border-radius:10px;font-weight:700;line-height:1.7}table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}th{background:#f1f5f9;padding:11px}td{padding:9px;text-align:center;border-top:1px solid #eee}input.num{width:76px;text-align:center}input.ticker{width:84px;text-align:center;font-weight:600;text-transform:uppercase}.buy{color:#16a34a;font-weight:700}.sell{color:#dc2626;font-weight:700}.del{background:#ef4444;color:#fff;border:none;border-radius:6px;padding:5px 10px}</style>
</head><body>
<div class="card">
<div class="top">
<label>API</label><input id="api" class="api" oninput="KEY=this.value;localStorage.setItem('key',KEY)">
<label>현금 $</label><input id="cash" class="num" value="10000" oninput="localStorage.setItem('cash',this.value)">
<button class="run" onclick="runAll()">실행</button>
<button class="add" onclick="addStock()">+종목</button>
<button class="reset" onclick="loadDefault()">리셋</button>
</div>
<div id="summary" class="summary"></div>
<table><thead><tr><th>Ticker</th><th>가격</th><th>수량</th><th>평가금</th><th>배당/회</th><th>받는금액(월)</th><th>현재%</th><th>목표%</th><th>조정</th><th>행동</th><th></th></tr></thead><tbody id="tb"></tbody></table>
</div>
<script>
const PAY_FREQ={JEPQ:12,JEPI:12,SCHD:4,QQQ:4,MSFT:4,AAPL:4,SPY:4,META:4,GOOG:0};
const FALLBACK={QQQ:674,META:609,SCHD:32,MSFT:414,GOOG:383,AAPL:280,SPY:721,JEPQ:59};
let KEY=localStorage.getItem('key')||'d7rcjv9r01qgahvd6c6gd7rcjv9r01qgahvd6c70'; api.value=KEY; cash.value=localStorage.getItem('cash')||10000;
let state=JSON.parse(localStorage.getItem('pf92'))||{holdings:[
{t:'QQQ',s:224,tg:20,d:0.52},{t:'META',s:167,tg:10,d:0.5},{t:'SCHD',s:3973,tg:40,d:0.66},
{t:'MSFT',s:187,tg:10,d:0.75},{t:'GOOG',s:168,tg:10,d:0},{t:'AAPL',s:100,tg:5,d:0.24},{t:'JEPQ',s:1300,tg:10,d:0.46}
]};
function save(){localStorage.setItem('pf92',JSON.stringify(state))}
function addStock(){state.holdings.push({t:'',s:0,tg:0,d:0});save();runAll()}
function loadDefault(){localStorage.removeItem('pf92');location.reload()}
async function price(t){try{let j=await fetch(`https://finnhub.io/api/v1/quote?symbol=${t}&token=${KEY}`).then(r=>r.json());return j.c||FALLBACK[t]}catch{return FALLBACK[t]}}
async function runAll(){
 let total=+cash.value||0;
 for(const h of state.holdings){h.p=await price(h.t);h.s=+h.s||0;h.v=h.p*h.s;total+=h.v}
 let y=0,yt=0;
 state.holdings.forEach(h=>{const f=PAY_FREQ[h.t]??4;y+=h.d*h.s*f;yt+=total*(h.tg/100)*(h.d*f)/(h.p||1)});
 summary.innerHTML=`총자산 $${Math.round(total).toLocaleString()}<br><span style="color:#059669">현재 연배당 $${Math.round(y).toLocaleString()} (월 $${Math.round(y/12).toLocaleString()})</span><br><span style="color:#2563eb">목표 연배당 $${Math.round(yt).toLocaleString()} (월 $${Math.round(yt/12).toLocaleString()})</span>`;
 tb.innerHTML=state.holdings.map((h,i)=>{const f=PAY_FREQ[h.t]??4;const monthly=h.d*h.s*f/12;const cur=total?h.v/total*100:0;const need=h.p?Math.round((total*h.tg/100-h.v)/h.p):0;const act=cur-h.tg>5?'SELL':cur-h.tg<-5?'BUY':'HOLD';return`<tr>
 <td><input class="ticker" value="${h.t}" onchange="state.holdings[${i}].t=this.value.toUpperCase();save();runAll()"></td>
 <td>$${Math.round(h.p)}</td>
 <td><input class="num" type="number" value="${h.s}" onchange="state.holdings[${i}].s=this.value;save();runAll()"></td>
 <td>$${Math.round(h.v).toLocaleString()}</td>
 <td><input class="num" step="0.01" value="${h.d}" onchange="state.holdings[${i}].d=this.value;save();runAll()"></td>
 <td style="color:#059669;font-weight:600">$${Math.round(monthly).toLocaleString()}</td>
 <td>${cur.toFixed(1)}%</td>
 <td><input class="num" step="0.1" value="${h.tg}" onchange="state.holdings[${i}].tg=this.value;save();runAll()"></td>
 <td class="${need>0?'buy':'sell'}">${need>0?'+':''}${need}</td>
 <td>${act}</td>
 <td><button class="del" onclick="state.holdings.splice(${i},1);save();runAll()">X</button></td>
 </tr>`}).join(''); save();
}
runAll();
</script></body></html>
