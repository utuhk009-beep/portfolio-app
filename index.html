<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Portfolio v4</title>
<style>body{font-family:-apple-system;background:#f3f4f6;padding:20px}.card{background:#fff;padding:20px;border-radius:12px}button{padding:8px 14px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer}table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}th{background:#e5e7eb;padding:10px}td{padding:9px;text-align:center;border-top:1px solid #eee}input{width:70px;padding:5px;text-align:center;border:1px solid #ddd;border-radius:4px}.buy{color:#16a34a;font-weight:700}.sell{color:#dc2626;font-weight:700}.div{color:#059669;font-weight:600}.dday{font-size:11px;color:#6b7280}</style>
</head><body>
<div class="card">
 Finnhub API <input id="api" style="width:220px"> 현금 $ <input id="cash" value="10000" style="width:90px">
 <button onclick="localStorage.setItem('key',document.getElementById('api').value);location.reload()">저장</button>
 <button onclick="runAll()">전체 분석 실행</button>
 <div id="macro" style="margin-top:8px;color:#555"></div>
 <div id="total" style="font-weight:700;margin-top:4px"></div>
 <table><thead><tr>
  <th>Ticker</th><th>가격</th><th>등락</th><th>수량</th><th>평가금액</th><th>배당/회</th><th>받는금액</th><th>배당락</th><th>현재%</th><th>목표%</th><th>조정수량</th><th>행동</th>
 </tr></thead><tbody id="tb"></tbody></table>
</div>

<script>
let KEY=localStorage.getItem('key')||'d7r49uhr01qtpsm10vc0d7r49ul'; document.getElementById('api').value=KEY;
let usdkrw=1471;

// 배당 데이터 - 실제 2026년 다음 배당일로 업데이트
const DIV={QQQ:{d:0.52,ex:'2026-06-16'},META:{d:0.50,ex:'2026-06-13'},SCHD:{d:0.66,ex:'2026-06-12'},MSFT:{d:0.75,ex:'2026-05-15'},GOOG:{d:0,ex:'-'},AAPL:{d:0.24,ex:'2026-05-09'},SPY:{d:1.60,ex:'2026-06-20'}};

let state=JSON.parse(localStorage.getItem('pf4'))||{holdings:[{t:'QQQ',s:224,tg:20},{t:'META',s:167,tg:10},{t:'SCHD',s:3973,tg:40},{t:'MSFT',s:187,tg:10},{t:'GOOG',s:168,tg:10},{t:'AAPL',s:100,tg:5},{t:'SPY',s:5,tg:0.6}]};

async function fj(u){try{return await (await fetch(u)).json()}catch{return{}}}
async function getFx(){try{const d=await fj('https://api.manana.kr/exchange/rate.json');if(Array.isArray(d)){const x=d.find(i=>i.code==='USD');if(x) usdkrw=x.rate}}catch{}}

function dday(ex){if(!ex||ex=='-')return '';const t=new Date(ex);const n=new Date();const diff=Math.ceil((t-n)/86400000);return diff>0?`D-${diff}`:diff===0?'D-Day':`D+${-diff}`}

async function price(t){const q=await fj(`https://finnhub.io/api/v1/quote?symbol=${t}&token=${KEY}`);return{c:+q.c||0,dp:+q.dp||0}}

async function runAll(){
 await getFx();
 const spy=await price('SPY');
 document.getElementById('macro').textContent=`SPY $${Math.round(spy.c)} | USD/KRW ${Math.round(usdkrw).toLocaleString()} (자동)`;
 
 let cash=+document.getElementById('cash').value||0; let total=cash;
 for(const h of state.holdings){const p=await price(h.t);h.p=p.c;h.dp=p.dp;h.s=+h.s||0;h.v=h.p*h.s;total+=h.v}
 
 document.getElementById('total').textContent=`총 자산: $${Math.round(total).toLocaleString()} (≈ ₩${Math.round(total*usdkrw).toLocaleString()})`;
 
 document.getElementById('tb').innerHTML=state.holdings.map((h,i)=>{
   const s=h.s, tg=+h.tg||0, pr=h.p, val=pr*s, cur=total?val/total*100:0;
   const need=Math.round((total*tg/100 - val)/(pr||1));
   const d=DIV[h.t]||{d:0,ex:'-'}; const rec=d.d*s; const act=cur-tg>5?'SELL':cur-tg<-5?'BUY':'HOLD';
   return `<tr>
    <td><input value="${h.t}" onchange="state.holdings[${i}].t=this.value.toUpperCase();localStorage.setItem('pf4',JSON.stringify(state))"></td>
    <td>$${Math.round(pr)}</td><td style="color:${h.dp>=0?'#16a34a':'#dc2626'}">${h.dp>=0?'+':''}${h.dp.toFixed(1)}%</td>
    <td><input type="number" value="${s}" onchange="state.holdings[${i}].s=this.value;localStorage.setItem('pf4',JSON.stringify(state));runAll()"></td>
    <td>$${Math.round(val).toLocaleString()}</td>
    <td class="div">$${d.d.toFixed(2)}</td><td class="div">$${Math.round(rec).toLocaleString()}</td>
    <td>${d.ex}<div class="dday">${dday(d.ex)}</div></td>
    <td>${cur.toFixed(1)}%</td>
    <td><input type="number" value="${tg}" onchange="state.holdings[${i}].tg=this.value;localStorage.setItem('pf4',JSON.stringify(state));runAll()"></td>
    <td class="${need>0?'buy':need<0?'sell':''}">${need>0?'+':''}${need}</td>
    <td>${act}</td></tr>`
 }).join('');
}
runAll();
</script></body></html>
