<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Manager PRO</title>

<style>
body { font-family: sans-serif; margin:0; background:#f5f7fa; }
.container { max-width:1100px; margin:auto; padding:20px; }
h1 { margin-bottom:10px; }
button { padding:6px 10px; margin:5px; cursor:pointer; }
input { width:80px; }
table { width:100%; border-collapse:collapse; margin-top:15px; }
th, td { border-bottom:1px solid #ddd; padding:8px; text-align:center; }
th { background:#eee; }
.green { color:green; }
.red { color:red; }
.summary { margin-top:15px; padding:10px; background:#fff; }
</style>

</head>

<body>
<div class="container">
<h1>📊 포트폴리오 관리자</h1>

<button onclick="add()">+ 종목 추가</button> <button onclick="save()">💾 저장</button> <button onclick="reset()">초기화</button>

<div class="summary">
총 자산: $<span id="total">0</span>
</div>

<table id="table">
<thead>
<tr>
<th>티커</th>
<th>가격</th>
<th>수량</th>
<th>평가금액</th>
<th>현재%</th>
<th>목표%</th>
<th>차이%</th>
<th>주문</th>
<th>삭제</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<script>
let state = JSON.parse(localStorage.getItem("portfolio")) || {
  holdings: [
    { ticker:"QQQ", price:508, qty:10, target:30 },
    { ticker:"META", price:585, qty:5, target:20 },
    { ticker:"SCHD", price:89, qty:60, target:50 }
  ]
};

function calc() {
  // 평가금액
  state.holdings.forEach(h => {
    h.value = h.price * h.qty;
  });

  // 총자산
  const total = state.holdings.reduce((s, h) => s + h.value, 0);

  // 비중 + 차이 + 주문수량
  state.holdings.forEach(h => {
    h.weight = total ? (h.value / total) * 100 : 0;
    h.diff = h.weight - h.target;

    const targetValue = total * (h.target / 100);
    const gap = targetValue - h.value;
    h.order = Math.round(gap / h.price);
  });

  return total;
}

function render() {
  const tbody = document.querySelector("#table tbody");
  const total = calc();

  document.getElementById("total").innerText = total.toLocaleString();

  tbody.innerHTML = "";

  state.holdings.forEach((h, i) => {
    const tr = document.createElement("tr");

    tr.innerHTML = `
<td><input value="${h.ticker}" onchange="update(${i}, 'ticker', this.value)"></td>
<td><input type="number" value="${h.price}" onchange="update(${i}, 'price', this.value)"></td>
<td><input type="number" value="${h.qty}" onchange="update(${i}, 'qty', this.value)"></td>
<td>$${h.value.toLocaleString()}</td>
<td>${h.weight.toFixed(1)}%</td>
<td><input type="number" value="${h.target}" onchange="update(${i}, 'target', this.value)"></td>
<td class="${h.diff>=0?'green':'red'}">${h.diff.toFixed(1)}%</td>
<td class="${h.order>=0?'green':'red'}">${h.order>=0?'BUY':'SELL'} ${Math.abs(h.order)}</td>
<td><button onclick="del(${i})">X</button></td>
`;

    tbody.appendChild(tr);
  });
}

function update(i, key, value) {
  if (key === "ticker") {
    state.holdings[i][key] = value.toUpperCase();
  } else {
    state.holdings[i][key] = Number(value);
  }
  render();
}

function add() {
  state.holdings.push({ ticker:"", price:0, qty:0, target:0 });
  render();
}

function del(i) {
  state.holdings.splice(i,1);
  render();
}

function save() {
  localStorage.setItem("portfolio", JSON.stringify(state));
  alert("저장 완료");
}

function reset() {
  localStorage.removeItem("portfolio");
  location.reload();
}

render();
</script>

</body>
</html>
