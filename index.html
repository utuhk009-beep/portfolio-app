<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Portfolio PRO (News Focus)</title>

<style>
body{font-family:-apple-system;background:#f5f6f8;margin:0}
.container{max-width:1100px;margin:auto;padding:20px}
.card{background:#fff;padding:16px;border-radius:10px;margin-top:12px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #eee;text-align:center}
input{width:70px;padding:4px}
button{padding:6px 10px;border:none;background:#111;color:#fff;border-radius:6px}
.warn{color:#dc2626;font-weight:bold}
.good{color:#059669}
</style>

</head>

<body>
<div class="container">

<h2>📊 Portfolio PRO (News Focus)</h2>

<div class="card">
Finnhub API
<input id="key" style="width:200px">
<button onclick="saveKey()">저장</button><br><br>

총 자산: <b id="total">$0</b><br><br>

현금 $ <input id="cash" value="10000"><br><br>

<button onclick="updatePrices()">🔄 가격 업데이트</button> <button onclick="loadNews()">📰 뉴스 불러오기</button>

</div>

<div class="card">
<button onclick="add()">+ 종목 추가</button>
<button onclick="save()">저장</button>
<button onclick="reset()">초기화</button>
</div>

<div class="card">
<table>
<thead>
<tr>
<th>티커</th><th>현재가</th><th>수량</th><th>목표%</th>
<th>현재%</th><th>금액</th><th>차이</th><th></th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<div class="card">
<h3>시장 상태</h3>
<div id="macro">-</div>
</div>

<div class="card">
<h3>중요 뉴스</h3>
<div id="newsBox">-</div>
</div>

</div>

<script>

let API = localStorage.getItem("key")||"";
document.getElementById("key").value = API;

function saveKey(){
 API=document.getElementById("key").value;
 localStorage.setItem("key",API);
 alert("저장됨");
}

let state = JSON.parse(localStorage.getItem("pf_news"))||{
 holdings:[
  {t:"QQQ",q:10,target:30,p:0},
  {t:"META",q:5,target:20,p:0},
  {t:"SCHD",q:60,target:50,p:0}
 ]
};

function save(){localStorage.setItem("pf_news",JSON.stringify(state));}
function reset(){localStorage.removeItem("pf_news");location.reload();}

function add(){
 state.holdings.push({t:"",q:0,target:0,p:0});
 render();
}

function del(i){
 state.holdings.splice(i,1);
 render();
}

async function getPrice(t){
 try{
  let r=await fetch(`https://finnhub.io/api/v1/quote?symbol=${t}&token=${API}`);
  let d=await r.json();
  return d.c||0;
 }catch{return 0;}
}

async function getNews(t){
 try{
  let to=new Date().toISOString().slice(0,10);
  let from=new Date(Date.now()-3*86400000).toISOString().slice(0,10);
  let r=await fetch(`https://finnhub.io/api/v1/company-news?symbol=${t}&from=${from}&to=${to}&token=${API}`);
  let d=await r.json();
  return (d||[]).slice(0,3);
 }catch{return [];}
}

async function updatePrices(){

 if(!API) return alert("API 입력");

 for(let h of state.holdings){
  if(!h.t) continue;
  h.p = await getPrice(h.t);
  await new Promise(r=>setTimeout(r,200));
 }

 render();
 save();
}

function render(){

 let tbody=document.getElementById("tbody");
 tbody.innerHTML="";

 let cash=+document.getElementById("cash").value;
 let total=cash;

 state.holdings.forEach(h=>{
  total+=h.p*h.q;
 });

 document.getElementById("total").innerText="$"+total.toLocaleString();

 state.holdings.forEach((h,i)=>{

  let val=h.p*h.q;
  let pct= total? (val/total*100):0;
  let tgt= total*(h.target/100);
  let diff=tgt-val;

  tbody.innerHTML+=`
  <tr>
  <td><input value="${h.t}" onchange="state.holdings[${i}].t=this.value.toUpperCase()"></td>
  <td>$${h.p||"-"}</td>
  <td><input value="${h.q}" onchange="state.holdings[${i}].q=+this.value;render()"></td>
  <td><input value="${h.target}" onchange="state.holdings[${i}].target=+this.value;render()"></td>
  <td>${pct.toFixed(1)}%</td>
  <td>$${val.toFixed(0)}</td>
  <td>${diff.toFixed(0)}</td>
  <td><button onclick="del(${i})">X</button></td>
  </tr>`;
 });

}

async function loadNews(){

 let box=document.getElementById("newsBox");
 box.innerHTML="";

 let macroText="";

 let spy=await getPrice("SPY");
 let vix=await getPrice("VIX");

 macroText = `SPY:${spy} / VIX:${vix}`;
 document.getElementById("macro").innerText=macroText;

 for(let h of state.holdings){

  let n=await getNews(h.t);

  if(n.length===0) continue;

  box.innerHTML+=`<b>${h.t}</b><br>`;

  n.forEach(x=>{
    let txt=x.headline;

    let cls="";
    if(txt.match(/lawsuit|sec|fraud|probe/i)) cls="warn";
    if(txt.match(/ai|growth|record/i)) cls="good";

    box.innerHTML+=`<div class="${cls}">• ${txt}</div>`;
  });

  box.innerHTML+="<br>";

  await new Promise(r=>setTimeout(r,200));
 }

 if(!box.innerHTML) box.innerHTML="-";
}

render();

</script>

</body>
</html>
