<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Portfolio Engine</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    table { border-collapse: collapse; width: 100%; margin-top:20px;}
    th, td { border:1px solid #ccc; padding:8px; text-align:center;}
    th { background:#f0f0f0; }
    .buy { color:green; font-weight:bold; }
    .sell { color:red; font-weight:bold; }
    .hold { color:gray; }
  </style>
</head>

<body>

<h2>📊 Portfolio</h2>

<button onclick="runAll()">전체 분석 실행</button>

<div id="macro" style="margin-top:10px;"></div>

<table>
  <thead>
    <tr>
      <th>Ticker</th>
      <th>현재 %</th>
      <th>목표 %</th>
      <th>행동</th>
    </tr>
  </thead>
  <tbody id="table"></tbody>
</table>

<h3>📰 News Sentiment</h3>
<div id="newsBox"></div>

<script>

// ----------------------
// 상태 (Portfolio)
// ----------------------
const state = {
  cash: 10000,
  holdings: [
    { t: "QQQ", shares: 7, target: 30 },
    { t: "META", shares: 5, target: 20 },
    { t: "SCHD", shares: 60, target: 50 }
  ]
};

// ----------------------
// 가격 (임시 데이터)
// ----------------------
async function price(ticker) {
  const fake = {
    QQQ: 674,
    META: 609,
    SCHD: 32,
    SPY: 721,
    VIX: 20
  };
  return fake[ticker] || 100;
}

// ----------------------
// 뉴스 (임시)
// ----------------------
async function news(ticker) {
  return [
    { headline: `${ticker} strong growth expected` },
    { headline: `${ticker} faces short term risk` }
  ];
}

// ----------------------
// 점수 계산
// ----------------------
function importance(text) {
  let score = 0;
  if (text.includes("growth")) score += 3;
  if (text.includes("strong")) score += 2;
  if (text.includes("risk")) score -= 3;
  return score;
}

// ----------------------
// 메인 엔진
// ----------------------
async function runAll() {

  // 매크로
  const spy = await price("SPY");
  const vix = await price("VIX");
  document.getElementById("macro").innerText =
    `SPY: ${spy} / VIX: ${vix}`;

  // 총 자산
  let total = 0;

  for (const h of state.holdings) {
    const p = await price(h.t);
    h.value = p * h.shares;
    total += h.value;
  }

  // 계산 + 행동
  for (const h of state.holdings) {
    h.current = (h.value / total) * 100;

    if (h.current > h.target) h.action = "sell";
    else if (h.current < h.target) h.action = "buy";
    else h.action = "hold";
  }

  render();

  // 뉴스
  renderNews();
}

// ----------------------
// UI 렌더링
// ----------------------
function render() {
  const table = document.getElementById("table");

  table.innerHTML = state.holdings.map(h => `
    <tr>
      <td>${h.t}</td>
      <td>${h.current.toFixed(1)}%</td>
      <td>${h.target}%</td>
      <td class="${h.action}">
        ${h.action.toUpperCase()}
      </td>
    </tr>
  `).join("");
}

// ----------------------
// 뉴스 렌더링
// ----------------------
async function renderNews() {
  let box = "";
  let totalScore = 0;

  for (const h of state.holdings) {
    const raw = await news(h.t);

    for (const n of raw) {
      const s = importance(n.headline);
      totalScore += s;
      box += `<div>• ${n.headline} (${s})</div>`;
    }
  }

  totalScore = Math.max(-10, Math.min(10, totalScore));

  document.getElementById("newsBox").innerHTML =
    `<b>Score: ${totalScore}</b><br>${box}`;
}

// ----------------------
// 자동 실행
// ----------------------
runAll();

</script>

</body>
</html>
