<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Portfolio PRO FINAL</title>
<style>
body{font-family:-apple-system;background:#f5f6f8;margin:0}
.container{max-width:1100px;margin:auto;padding:20px}
.card{background:#fff;padding:16px;border-radius:10px;margin-top:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
input{width:80px;text-align:right;padding:4px;border:1px solid #ddd;border-radius:4px}
.btn{padding:8px 14px;border:none;border-radius:6px;cursor:pointer;background:#111;color:#fff}
.buy{color:#059669;font-weight:bold}
.sell{color:#dc2626;font-weight:bold}
.risk{color:#dc2626;font-weight:bold;margin:4px 0}
h2{margin:0 0 10px}
</style>
</head>

<body>
<div class="container">

<h2>📊 Portfolio PRO FINAL</h2>

<div class="card">
현금 $<input id="cash" value="10000">
세율 LT <input id="taxLT" value="0.15">
세율 ST <input id="taxST" value="0.30">
API <input id="key" style="width:200px;text-align:left">
<button class="btn" onclick="saveKey()">저장</button>
<button class="btn" onclick="updateAll()">🔄 실행</button>
</div>

<div class="card"><h3>주문</h3><div id="orders"></div></div>
<div class="card"><h3>시뮬레이션</h3><div id="simulation"></div></div>
<div class="card"><h3>리스크</h3><div id="risk"></div></div>

</div>

<script>
let API_KEY = localStorage.getItem("key")||"";
document.getElementById("key").value = API_KEY;

function saveKey(){
 API_KEY = document.getElementById("key").value;
 localStorage.setItem("key",API_KEY);
 alert("저장됨");
}

let state = JSON.parse(localStorage.getItem("pf"))||{
 holdings:[
  {ticker:"QQQ",price:500,qty:10,target:30,cost:400,holdDays:400},
  {ticker:"META",price:580,qty:5,target:20,cost:300,holdDays:200},
  {ticker:"SCHD",price:90,qty:60,target:50,cost:70,holdDays:500}
 ]
};

async function price(t){
 try{
   let r=await fetch(`https://finnhub.io/api/v1/quote?symbol=${t}&token=${API_KEY}`);
   let d=await r.json();
   return d.c||0;
 }catch{return 0;}
}

async function news(t){
 try{
  let to=new Date().toISOString().slice(0,10);
  let from=new Date(Date.now()-5*86400000).toISOString().slice(0,10);
  let r=await fetch(`https://finnhub.io/api/v1/company-news?symbol=${t}&from=${from}&to=${to}&token=${API_KEY}`);
  let d=await r.json();

  let seen=new Set();
  return d.filter(x=>{
    if(!x.headline || seen.has(x.headline)) return false;
    seen.add(x.headline);
    return true;
  }).slice(0,3);

 }catch{return [];}
}

async function updateAll(){

 if(!API_KEY) return alert("API 키 입력");

 let cash=+document.getElementById("cash").value;
 let taxLT=+document.getElementById("taxLT").value;
 let taxST=+document.getElementById("taxST").value;

 let total=cash;

 for(let h of state.holdings){
  h.price=await price(h.ticker);
  total+=h.price*h.qty;
  await new Promise(r=>setTimeout(r,350));
 }

 let buy=0,sell=0,tax=0,orderText="",riskText="";

 for(let h of state.holdings){

  if(!h.price || h.price<=0) continue;

  let val=h.price*h.qty;
  let target=total*(h.target/100);
  let diff=target-val;

  let raw = h.price ? diff/h.price : 0;
  if(!isFinite(raw)) raw=0;

  let qty = diff>0 ? Math.floor(raw) : Math.ceil(raw);

  // BUY 제한
  if(qty>0){
    let maxBuy = Math.floor((cash - buy) / h.price);
    qty = Math.min(qty, maxBuy);
  }

  // SELL 처리
  if(qty<0){
    let sellQty=Math.abs(qty);

    let gain=(h.price-(h.cost||h.price))*sellQty;
    let rate=(h.holdDays||0)>365?taxLT:taxST;
    let t=gain>0?gain*rate:0;

    let net = sellQty*h.price - t;
    if(net<0) continue;

    tax+=t;
    sell+=sellQty*h.price;

    orderText+=`<div class="sell">SELL ${sellQty} ${h.ticker} @ $${h.price} (Tax $${t.toFixed(0)})</div>`;
    continue;
  }

  if(qty>0){
    buy+=qty*h.price;
    orderText+=`<div class="buy">BUY ${qty} ${h.ticker} @ $${h.price}</div>`;
  }

  // 🔥 뉴스 리스크
  let n=await news(h.ticker);
  n.forEach(x=>{
    if(x.headline.match(/lawsuit|crash|drop|investigation|downgrade|SEC|probe|recall/i)){
      riskText+=`<div class="risk">⚠ ${h.ticker}: ${x.headline}</div>`;
    }
  });

  await new Promise(r=>setTimeout(r,350));
 }

 document.getElementById("orders").innerHTML =
  `BUY: $${buy.toLocaleString()} | SELL: $${sell.toLocaleString()}<br><br>${orderText||"리밸런싱 불필요"}`;

 document.getElementById("simulation").innerHTML =
  `세금: $${tax.toFixed(0)}<br>
   순현금: $${(sell - buy - tax).toFixed(0)}<br>
   최종 현금: $${(cash - buy + sell - tax).toFixed(0)}`;

 document.getElementById("risk").innerHTML =
  riskText || "✓ 최근 주요 리스크 없음";

 localStorage.setItem("pf", JSON.stringify(state));
}
</script>

</body>
</html>
