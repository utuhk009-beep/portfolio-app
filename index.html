<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Portfolio v8</title>
<style>body{font-family:-apple-system;background:#f3f4f6;padding:20px}.card{background:#fff;padding:20px;border-radius:12px}button{padding:8px 14px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;margin-right:6px}button.reset{background:#6b7280}table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}th{background:#e5e7eb;padding:10px}td{padding:9px;text-align:center;border-top:1px solid #eee}input{width:70px;padding:5px;text-align:center;border:1px solid #ddd;border-radius:4px}.buy{color:#16a34a;font-weight:700}.sell{color:#dc2626;font-weight:700}.div{color:#059669;font-weight:600}.dday{font-size:11px;color:#6b7280}</style>
</head><body>
<div class="card">
 Finnhub API <input id="api" style="width:220px"> 현금 $ <input id="cash" value="10000" style="width:90px">
 <button onclick="saveKey()">저장</button>
 <button onclick="runAll()">전체 분석 실행</button>
 <button class="reset" onclick="loadDefault()">기본 포트폴리오 불러오기</button>
 <div id="macro" style="margin-top:8px;color:#555"></div>
 <div id="total" style="font-weight:700;margin-top:4px;font-size:15px;line-height:1.6"></div>
 <div id="targetSum" style="margin-top:4px;font-weight:600"></div>
 <table><thead><tr><th>Ticker</th><th>가격</th><th>등락</th><th>수량</th><th>평가금액</th><th>배당/회</th><th>받는금액</th><th>배당락</th><th>현재%</th><th>목표%</th><th>조정수량</th><th>행동</th></tr></thead><tbody id="tb"></tbody></table>
</div>

<script>
let KEY=localStorage.getItem('key')||'d7r49uhr01qtpsm10vc0d7r49ul'; document.getElementById('api').value=KEY;
function saveKey(){localStorage.setItem('key',document.getElementById('api').value);location.reload()}
let usdkrw=1471;
const DIV={QQQ:{d:0.52,ex:'2026-06-16',f:4},META:{d:0.50,ex:'2026-06-13',f:4},SCHD:{d:0.66,ex:'2026-06-12',f:4},MSFT:{d:0.75,ex:'2026-05-15',f:4},GOOG:{d:0,ex:'-',f:4},AAPL:{d:0.24,ex:'2026-05-09',f:4},SPY:{d:1.60,ex:'2026-06-20',f:4}};
const DEFAULT=[{t:'QQQ',s:224,tg:20},{t:'META',s:167,tg:10},{t:'SCHD',s:3973,tg:40},{t:'MSFT',s:187,tg:10},{t:'GOOG',s:168,tg:10},{t:'AAPL',s:100,tg:5},{t:'SPY',s:5,tg:0.6}];

let state=JSON.parse(localStorage.getItem('pf8'))||{holdings:JSON.parse(JSON.stringify(DEFAULT))};
function loadDefault(){state.holdings=JSON.parse(JSON.stringify(DEFAULT));localStorage.setItem('pf8',JSON.stringify(state));runAll()}

async function fj(u){try{return await (await fetch(u)).json()}catch{return{}}}
async function getFx(){try{const d=await fj('https://api.manana.kr/exchange/rate.json');usdkrw=d.find(i=>i.code==='USD').rate}catch{}}
function dday(ex){if(!ex||ex=='-')return'';const diff=Math.ceil((new Date(ex)-new Date())/86400000);return diff>0?`D-${diff}`:diff===0?'D-Day':`D+${-diff}`}
async function price(t){const q=await fj(`https://finnhub.io/api/v1/quote?symbol=${t}&token=${KEY}`);return{c:+q.c||0,dp:+q.dp||0}}

async function runAll(){
 await getFx();
 const spy=await price('SPY');
 document.getElementById('macro').textContent=`SPY $${Math.round(spy.c)} | USD/KRW ${Math.round(usdkrw).toLocaleString()}`;
 
 const sumTg=state.holdings.reduce((a,h)=>a+(+h.tg||0),0);
 document.getElementById('targetSum').innerHTML = sumTg>100?`<span style="color:#dc2626">⚠️ 목표 합계 ${sumTg.toFixed(1)}% 초과</span>`:sumTg<99.9?`<span style="color:#d97706">목표 합계 ${sumTg.toFixed(1)}% (현금 ${(100-sumTg).toFixed(1)}% 남음)</span>`:`<span style="color:#059669">✓ 목표 합계 100%</span>`;
 
 let cash=+document.getElementById('cash').value||0; let total=cash;
 for(const h of state.holdings){const p=await price(h.t);h.p=p.c;h.dp=p.dp;h.s=+h.s||0;h.v=h.p*h.s;total+=h.v}
 
 let qDiv=0,yDiv=0,qDivT=0,yDivT=0;
 for(const h of state.holdings){const d=DIV[h.t]||{d:0,f:4};qDiv+=d.d*h.s;yDiv+=d.d*h.s*d.f;const ts=total*(+h.tg||0)/100/(h.p||1);qDivT+=ts*d.d;yDivT+=ts*d.d*d.f}

 document.getElementById('total').innerHTML=`총 자산: $${Math.round(total).toLocaleString()} (≈ ₩${Math.round(total*usdkrw).toLocaleString()})<br><span style="color:#059669">현재 연배당 $${Math.round(yDiv).toLocaleString()} (분기 $${Math.round(qDiv).toLocaleString()})</span><span style="color:#2563eb;margin-left:14px">| 목표 비중 시 연배당 $${Math.round(yDivT).toLocaleString()} (분기 $${Math.round(qDivT).toLocaleString()})</span>`;
 
 document.getElementById('tb').innerHTML=state.holdings.map((h,i)=>{const s=h.s,tg=+h.tg||0,pr=h.p,val=pr*s,cur=total?val/total*100:0,need=Math.round((total*tg/100-val)/(pr||1));const d=DIV[h.t]||{d:0,ex:'-'};const rec=d.d*s;const act=cur-tg>5?'SELL':cur-tg<-5?'BUY':'HOLD';return`<tr><td><input value="${h.t}" onchange="state.holdings[${i}].t=this.value.toUpperCase();localStorage.setItem('pf8',JSON.stringify(state))"></td><td>$${Math.round(pr)}</td><td style="color:${h.dp>=0?'#16a34a':'#dc2626'}">${h.dp>=0?'+':''}${h.dp.toFixed(1)}%</td><td><input type="number" value="${s}" onchange="state.holdings[${i}].s=this.value;localStorage.setItem('pf8',JSON.stringify(state));runAll()"></td><td>$${Math.round(val).toLocaleString()}</td><td class="div">$${d.d.toFixed(2)}</td><td class="div">$${Math.round(rec).toLocaleString()}</td><td>${d.ex}<div class="dday">${dday(d.ex)}</div></td><td>${cur.toFixed(1)}%</td><td><input type="number" step="0.1" value="${tg}" onchange="state.holdings[${i}].tg=this.value;localStorage.setItem('pf8',JSON.stringify(state));runAll()"></td><td class="${need>0?'buy':need<0?'sell':''}">${need>0?'+':''}${need}</td><td>${act}</td></tr>`}).join('');
 localStorage.setItem('pf8',JSON.stringify(state));
}
runAll();
</script></body></html>
