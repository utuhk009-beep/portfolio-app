<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Portfolio PRO LEVEL 7 - Final</title>
<style>
body{margin:0;background:#f5f7fb;font-family:"Noto Sans KR",sans-serif}
.container{max-width:1360px;margin:auto;padding:20px}
.card{background:#fff;padding:16px;border-radius:12px;margin-top:12px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px;border-bottom:1px solid #eee;text-align:center}
th{background:#fafafa;color:#555}
input{padding:6px;width:80px;text-align:center;border:1px solid #ddd;border-radius:6px}
button{padding:7px 12px;border:none;border-radius:7px;background:#111;color:#fff;cursor:pointer;margin:2px}
button.secondary{background:#e5e7eb;color:#111}
button.del{background:transparent;color:#999;font-size:16px;padding:4px 6px}
button.del:hover{color:#dc2626}
.up{color:#059669;font-weight:700}
.down{color:#dc2626;font-weight:700}
.warn{color:#d97706;font-weight:700}
.badge{background:#eef2ff;padding:3px 8px;border-radius:999px;font-size:12px}
.news-link{color:#111;text-decoration:none}
.news-link:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="container">
<h2>📊 Portfolio PRO LEVEL 7 <span id="fx" class="badge">USD/KRW -</span></h2>

<div class="card">
API <input id="api" style="width:240px">
현금 $ <input id="cash" value="10000">
<button onclick="saveKey()">저장</button>
<button onclick="updatePrices()">가격 업데이트</button>
<button onclick="runAll()">전체 분석</button>
</div>

<div class="card">
<button class="secondary" onclick="add()">+ 종목</button>
<button class="secondary" onclick="save()">저장</button>
<button class="secondary" onclick="reset()">초기화</button>
</div>

<div class="card">
<table>
<thead><tr><th>티커</th><th>가격</th><th>등락률</th><th>거래량</th><th>수량</th><th>목표%</th><th>현재%</th><th>금액</th><th>차이</th><th>ACTION</th><th></th></tr></thead>
<tbody id="tbody"></tbody>
</table>
</div>

<div class="card"><b>시장</b> <div id="macro">-</div></div>
<div class="card"><b>뉴스</b> <div id="newsBox">-</div></div>
</div>

<script>
let KEY=localStorage.getItem('key')||'';document.getElementById('api').value=KEY;
let usdkrw=1471.32;
function saveKey(){KEY=document.getElementById('api').value.trim();localStorage.setItem('key',KEY);alert('저장됨')}

let state=JSON.parse(localStorage.getItem('pf7'))||{holdings:[
 {t:'QQQ',q:7,target:30,p:0,dp:0,vol:0},
 {t:'META',q:5,target:20,p:0,dp:0,vol:0},
 {t:'SCHD',q:60,target:50,p:0,dp:0,vol:0}
]};

function add(){state.holdings.push({t:'',q:0,target:0,p:0,dp:0,vol:0});render();save()}
function save(){localStorage.setItem('pf7',JSON.stringify(state))}
function reset(){if(confirm('초기화?')){localStorage.removeItem('pf7');location.reload()}}
function del(i){state.holdings.splice(i,1);render();save()}

async function fetchJSON(u){try{return await (await fetch(u)).json()}catch{return null}}

// 환율 - manana.kr (실시간)
async function getFx(){
 try{
  const d=await fetchJSON('https://api.manana.kr/exchange/rate.json');
  const usd=d.find(x=>x.code==='USD');
  if(usd) usdkrw=usd.rate;
 }catch{}
 document.getElementById('fx').textContent=`USD/KRW ${usdkrw.toLocaleString()}`;
}

// 가격 + 등락률 + 거래량
async function price(t){
 if(!t) return {c:0,dp:0,v:0};
 const q=await fetchJSON(`https://finnhub.io/api/v1/quote?symbol=${t}&token=${KEY}`);
 const c=q?.c||0, dp=q?.dp||0;
 const to=Math.floor(Date.now()/1000), from=to-604800;
 const candle=await fetchJSON(`https://finnhub.io/api/v1/stock/candle?symbol=${t}&resolution=D&from=${from}&to=${to}&token=${KEY}`);
 const v=candle?.v?candle.v[candle.v.length-1]:0;
 return {c,dp,v}
}

async function news(t){
 const to=new Date().toISOString().slice(0,10), from=new Date(Date.now()-432000000).toISOString().slice(0,10);
 const d=await fetchJSON(`https://finnhub.io/api/v1/company-news?symbol=${t}&from=${from}&to=${to}&token=${KEY}`);
 return Array.isArray(d)?d:[]
}

// 번역 - 한도 초과 시 원문 반환
async function translateToKo(txt){
 try{
  if(!txt) return txt;
  const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(txt)}&langpair=en|ko`);
  const d=await r.json();
  const t=d?.responseData?.translatedText||txt;
  if(t.toUpperCase().includes('MYMEMORY WARNING')||t.includes('USAGE LIMITS')) return txt;
  return t;
 }catch{return txt}
}

function sentiment(txt){let s=0;if(/inflation|recession|concerning|weak|slowdown|tightening|hawkish/i.test(txt))s-=2;if(/risk|pressure|miss|downgrade|lawsuit|fraud|bankruptcy|cut/i.test(txt))s-=1;if(/growth|strong|beat|upgrade|record|surge|expansion/i.test(txt))s+=2;return s}
function importance(txt){let b=0;if(/fed|cpi|inflation|rate|recession/i.test(txt))b+=6;if(/lawsuit|fraud|bankruptcy/i.test(txt))b+=5;if(/earnings|guidance|miss|downgrade/i.test(txt))b+=4;if(/beat|record|growth|upgrade/i.test(txt))b+=3;return b*sentiment(txt)}
function structureScore(h,total){const v=h.p*h.q,p=total?v/total*100:0,g=p-h.target;if(g>30)return-7;if(g>20)return-5;if(g>10)return-3;if(g<-30)return 7;if(g<-20)return 5;if(g<-10)return 3;return 0}
function macroScore(v,s){let m=0;if(v>25)m-=2;if(s<400)m-=2;if(v<18)m+=1;if(s>420)m+=1;return m}
function decision(n,m,s){const t=n+m+s;if(s<=-5)return{txt:'REDUCE',cls:'down'};if(s>=5)return{txt:'ADD',cls:'up'};if(t>=5)return{txt:'ADD',cls:'up'};if(t<=-5)return{txt:'REDUCE',cls:'down'};return{txt:'HOLD',cls:'warn'}}
function fmtVol(v){if(!v)return'-';if(v>=1e9)return(v/1e9).toFixed(1)+'B';if(v>=1e6)return(v/1e6).toFixed(1)+'M';return(v/1e3).toFixed(0)+'K'}

function render(){
 const tb=document.getElementById('tbody');tb.innerHTML='';
 const cash=+document.getElementById('cash').value||0;let total=cash;
 state.holdings.forEach(h=>total+=(h.p||0)*h.q);
 state.holdings.forEach((h,i)=>{
  const val=(h.p||0)*h.q;const pct=total?val/total*100:0;const tgt=total*h.target/100;const diff=tgt-val;const dp=h.dp||0;
  tb.innerHTML+=`<tr>
   <td><input value="${h.t}" onchange="state.holdings[${i}].t=this.value.toUpperCase();save()"></td>
   <td>$${Math.round(h.p||0)}</td>
   <td class="${dp>=0?'up':'down'}">${dp>=0?'+':''}${dp.toFixed(2)}%</td>
   <td>${fmtVol(h.vol)}</td>
   <td><input value="${h.q}" onchange="state.holdings[${i}].q=+this.value;render();save()"></td>
   <td><input value="${h.target}" onchange="state.holdings[${i}].target=+this.value;render();save()"></td>
   <td>${pct.toFixed(1)}%</td>
   <td>$${Math.round(val).toLocaleString()}</td>
   <td>${Math.round(diff).toLocaleString()}</td>
   <td id="act${i}">-</td>
   <td><button class="del" onclick="del(${i})" title="삭제">🗑️</button></td>
  </tr>`;
 });
}

async function updatePrices(){await getFx();for(const h of state.holdings){const d=await price(h.t);h.p=d.c;h.dp=d.dp;h.vol=d.v}render();save()}

async function runAll(){
 const spy=await price('SPY');const vix=await price('VIX');const v=vix.c||20;
 document.getElementById('macro').textContent=`SPY $${Math.round(spy.c)} · VIX ${v.toFixed(1)}`;
 const total=state.holdings.reduce((s,h)=>s+(h.p||0)*h.q,0)+(+document.getElementById('cash').value||0);
 let box='';
 for(let i=0;i<state.holdings.length;i++){
  const h=state.holdings[i];const raw=await news(h.t);let sum=0;
  const filtered=raw.map(n=>({...n,s:importance((n.headline||'')+' '+(n.summary||''))})).filter(n=>Math.abs(n.s)>=3).sort((a,b)=>Math.abs(b.s)-Math.abs(a.s)).slice(0,2);
  box+=`<b>${h.t}</b><br>`;
  for(const n of filtered){
   sum+=n.s;
   const ko=await translateToKo(n.headline);
   box+=`<div style="margin:4px 0"><a class="news-link" href="${n.url}" target="_blank">${n.s>0?'▲':'▼'} ${ko}</a> <span style="color:#888;font-size:12px">(score:${n.s})</span></div>`;
  }
  sum=Math.max(-10,Math.min(10,sum));
  const struct=structureScore(h,total);const macro=macroScore(v,spy.c);const d=decision(sum,macro,struct);
  document.getElementById('act'+i).innerHTML=`<span class="${d.cls}">${d.txt}</span>`;
  box+='<br>';
 }
 document.getElementById('newsBox').innerHTML=box;
}
render();getFx();
</script>
</body>
</html>
