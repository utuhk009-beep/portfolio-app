<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Manager PRO White v4</title>
<style>
:root{
  --bg:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
  --border:#e2e8f0;
  --primary:#0f172a;
  --primary-contrast:#ffffff;
  --amber-bg:#fffbeb;
  --amber-border:#fde68a;
  --amber-text:#92400e;
  --green:#059669;
  --red:#dc2626;
  --gray-50:#f8fafc;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
header{
  position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,.9);
  backdrop-filter:saturate(180%) blur(8px);
  border-bottom:1px solid var(--border);
  padding:14px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.badge{font-size:11px;font-weight:500;background:var(--gray-50);color:var(--muted);padding:3px 8px;border-radius:999px;border:1px solid var(--border)}
.rate{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.rate strong{color:var(--text);font-variant-numeric:tabular-nums}
.container{max-width:1120px;margin:0 auto;padding:24px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
button{
  appearance:none;border:1px solid var(--border);background:#fff;color:var(--text);
  padding:8px 12px;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;
  transition:all .15s;display:inline-flex;align-items:center;gap:6px;
}
button:hover{background:var(--gray-50)}
button.primary{background:var(--primary);color:var(--primary-contrast);border-color:var(--primary)}
button.primary:hover{opacity:.92}
button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
button:disabled{opacity:.55;cursor:not-allowed}
.summary{
  display:flex;flex-wrap:wrap;gap:20px;align-items:center;
  padding:14px 16px;background:var(--gray-50);border:1px solid var(--border);border-radius:12px;margin-bottom:16px;
  font-size:14px;
}
.summary > div{display:flex;align-items:center;gap:8px}
.summary strong{font-size:16px;font-variant-numeric:tabular-nums}
.summary input{width:120px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;font-size:14px;text-align:right;background:#fff}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:#fff}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:900px}
thead th{
  position:sticky;top:0;background:#fff;z-index:1;
  font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;
  padding:10px 12px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;
}
thead th:first-child,tbody td:first-child{text-align:left}
tbody td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fcfcfd}
td input{width:100%;border:1px solid transparent;background:transparent;padding:6px 6px;border-radius:6px;text-align:right;font-variant-numeric:tabular-nums}
td input:focus{outline:none;border-color:var(--primary);background:#fff}
td input.ticker{text-align:left;font-weight:600;text-transform:uppercase}
.krw{display:block;font-size:11px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.krw.hidden{display:none}
.cell-value{font-variant-numeric:tabular-nums}
.cell-diff.pos{color:var(--green)}
.cell-diff.neg{color:var(--red)}
.order-buy{color:var(--green);font-weight:600}
.order-sell{color:var(--red);font-weight:600}
.exdate{font-variant-numeric:tabular-nums}
.exdate.soon{color:var(--amber-text);font-weight:700}
tfoot td{padding:12px;font-weight:600;background:var(--gray-50);border-top:1px solid var(--border);text-align:right}
tfoot td:first-child{text-align:left}
.warn{color:var(--red)}
.btn-del{border:none;background:transparent;color:#94a3b8;padding:4px 6px;border-radius:6px}
.btn-del:hover{background:#fee2e2;color:#dc2626}
.alert-banner{background:var(--amber-bg);color:var(--amber-text);border-bottom:1px solid var(--amber-border);padding:10px 24px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.alert-banner.hidden{display:none}
.order-list{margin-top:22px;border:1px solid var(--border);border-radius:12px;background:#fff;overflow:hidden}
.order-list h3{margin:0;padding:12px 16px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);background:var(--gray-50)}
.order-list pre{margin:0;padding:14px 16px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.65;white-space:pre-wrap;background:#fff}
@media (max-width:720px){
  header{flex-direction:column;align-items:flex-start;gap:6px;padding:12px 16px}
  .container{padding:16px}
  .summary{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>
<header>
  <h1>Portfolio Manager PRO <span class="badge">White v4</span></h1>
  <div class="rate">환율 $1 = <strong>₩<span id="rateVal">1,350</span></strong> <span id="rateTime"></span></div>
</header>

<div id="alertBanner" class="alert-banner hidden"></div>

<main class="container">
  <div class="toolbar">
    <button id="krwToggle">₩ 토글</button>
    <button id="notifyBtn">🔔 알림 허용</button>
    <button id="divUpdateBtn">배당일 갱신</button>
    <div style="flex:1"></div>
    <button id="addBtn">+ 종목 추가</button>
    <button id="calcBtn" class="primary">계산</button>
    <button id="resetBtn">초기화</button>
  </div>

  <div class="summary">
    <div>총 자산 <strong id="totalAssets">$0</strong></div>
    <div>현금(USD) <input id="cashInput" type="number" step="100" min="0"></div>
    <div>최소 주문수량 <input id="minShares" type="number" min="1" step="1"></div>
  </div>

  <div class="table-wrap">
    <table id="holdingsTable">
      <thead>
        <tr>
          <th>티커</th>
          <th>현재가</th>
          <th>보유수량</th>
          <th>목표%</th>
          <th>평가금액</th>
          <th>목표금액</th>
          <th>차액</th>
          <th>배당락</th>
          <th>주문</th>
          <th></th>
        </tr>
      </thead>
      <tbody></tbody>
      <tfoot>
        <tr>
          <td colspan="3">합계</td>
          <td id="targetSum">0%</td>
          <td colspan="6"></td>
        </tr>
      </tfoot>
    </table>
  </div>

  <div class="order-list">
    <h3>ORDER LIST (IPS 실행 엔진)</h3>
    <pre id="orderOutput"></pre>
  </div>
</main>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const fmt = {
    money: v => '$' + Math.round(v).toLocaleString('en-US'),
    price: v => '$' + Number(v).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}),
    krw: v => '₩' + Math.round(v).toLocaleString('ko-KR'),
    date: d => { const dt = new Date(d); return String(dt.getMonth()+1).padStart(2,'0') + '/' + String(dt.getDate()).padStart(2,'0'); }
  };
  const todayStr = () => new Date().toISOString().slice(0,10);
  const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };

  const DEFAULT = {
    cash:10000,
    minShares:1,
    krwEnabled:true,
    usdKrw:1350,
    rateTime:null,
    holdings:[
      {ticker:'QQQ', price:508.23, shares:10, target:30, exDate:null},
      {ticker:'META', price:585.40, shares:5, target:20, exDate:null},
      {ticker:'SCHD', price:89.12, shares:60, target:50, exDate:null},
    ]
  };

  let state = JSON.parse(localStorage.getItem('pmpro_v4_white') || 'null') || structuredClone(DEFAULT);
  const save = () => localStorage.setItem('pmpro_v4_white', JSON.stringify(state));

  function render(){
    $('#cashInput').value = state.cash;
    $('#minShares').value = state.minShares;
    $('#krwToggle').classList.toggle('active', state.krwEnabled);

    const tbody = $('#holdingsTable tbody');
    tbody.innerHTML = '';

    let totalValue = state.cash;
    state.holdings.forEach(h => totalValue += (h.shares||0)*(h.price||0));
    const totalKrw = totalValue * state.usdKrw;

    $('#totalAssets').innerHTML = state.krwEnabled
      ? `${fmt.money(totalValue)} / ${fmt.krw(totalKrw)}`
      : fmt.money(totalValue);

    let targetSum = 0;
    const orders = [];

    state.holdings.forEach((h,i)=>{
      targetSum += +h.target||0;
      const value = (h.shares||0)*(h.price||0);
      const targetValue = totalValue * (+h.target||0)/100;
      const diff = targetValue - value;
      let sharesToTrade = 0;
      if (h.price>0){
        sharesToTrade = diff>0 ? Math.floor(diff/h.price) : Math.ceil(diff/h.price);
        if (Math.abs(sharesToTrade) < state.minShares) sharesToTrade = 0;
      }
      if (sharesToTrade!==0) orders.push({...h, sharesToTrade, diff});

      const ex = h.exDate ? new Date(h.exDate) : null;
      const todayMid = new Date(); todayMid.setHours(0,0,0,0);
      const dday = ex ? Math.ceil((ex - todayMid)/86400000) : null;
      const isSoon = dday!==null && dday>=0 && dday<=3;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input class="ticker" data-i="${i}" data-k="ticker" value="${h.ticker}"></td>
        <td><input data-i="${i}" data-k="price" type="number" step="0.01" value="${h.price}"></td>
        <td><input data-i="${i}" data-k="shares" type="number" step="1" value="${h.shares}"></td>
        <td><input data-i="${i}" data-k="target" type="number" step="0.1" value="${h.target}"></td>
        <td class="cell-value">
          <div>${fmt.money(value)}</div>
          <span class="krw ${state.krwEnabled?'':'hidden'}">${fmt.krw(value*state.usdKrw)}</span>
        </td>
        <td class="cell-value">${fmt.money(targetValue)}</td>
        <td class="cell-value cell-diff ${diff>=0?'pos':'neg'}">${diff>=0?'+':''}${fmt.money(diff)}</td>
        <td><span class="exdate ${isSoon?'soon':''}">${h.exDate?fmt.date(h.exDate):'-'}</span></td>
        <td>${sharesToTrade===0?'-':`<span class="${sharesToTrade>0?'order-buy':'order-sell'}">${sharesToTrade>0?'BUY':'SELL'} ${Math.abs(sharesToTrade)}</span>`}</td>
        <td><button class="btn-del" data-del="${i}" title="삭제">✕</button></td>
      `;
      tbody.appendChild(tr);
    });

    $('#targetSum').textContent = targetSum.toFixed(1)+'%';
    $('#targetSum').className = Math.abs(targetSum-100)>0.01 ? 'warn' : '';

    const out = $('#orderOutput');
    if (Math.abs(targetSum-100)>0.01){
      out.textContent = `⚠️ 목표 비중 합계가 100%가 아닙니다. (현재 ${targetSum.toFixed(1)}%)`;
    } else if (orders.length===0){
      out.textContent = '✓ 리밸런싱 불필요 - 모든 종목이 목표 범위 내입니다.';
    } else {
      orders.sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff));
      // 🔧 1️⃣ 총 매수/매도/차이 표시
      let totalBuy = 0;
      let totalSell = 0;
      orders.forEach(o=>{
        const amount = Math.abs(o.sharesToTrade) * o.price;
        if(o.sharesToTrade > 0) totalBuy += amount;
        else totalSell += amount;
      });
      const summary = `BUY:  $${Math.floor(totalBuy).toLocaleString()}
SELL: $${Math.floor(totalSell).toLocaleString()}
DIFF: $${Math.floor(totalSell - totalBuy).toLocaleString()}

`;
      out.textContent = summary + orders.map(o =>
        `${o.sharesToTrade>0?'BUY ':'SELL'} ${String(Math.abs(o.sharesToTrade)).padStart(3,' ')} ${o.ticker.padEnd(5,' ')} @ ${fmt.price(o.price)}`
      ).join('\n');
    }

    save();
    updateBanner();
  }

  function updateRateDisplay(){
    $('#rateVal').textContent = state.usdKrw.toLocaleString('ko-KR',{maximumFractionDigits:2});
    $('#rateTime').textContent = state.rateTime ? `(${new Date(state.rateTime).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})})` : '';
  }

  async function fetchExchangeRate(){
    updateRateDisplay();
    const age = state.rateTime ? Date.now()-state.rateTime : Infinity;
    if (age < 1000*60*60*6) return;
    try{
      const res = await fetch('https://open.er-api.com/v6/latest/USD');
      const json = await res.json();
      if (json && json.rates && json.rates.KRW){
        state.usdKrw = json.rates.KRW;
        state.rateTime = Date.now();
        save();
        updateRateDisplay();
        render();
      }
    }catch(e){}
  }

  function updateBanner(){
    const banner = $('#alertBanner');
    const todayMid = new Date(); todayMid.setHours(0,0,0,0);
    const upcoming = state.holdings
      .filter(h=>h.exDate)
      .map(h=>({ ...h, d: Math.ceil((new Date(h.exDate)-todayMid)/86400000) }))
      .filter(h=>h.d>=0 && h.d<=3)
      .sort((a,b)=>a.d-b.d);

    if (upcoming.length){
      banner.innerHTML = upcoming.map(u=>`🔔 ${u.ticker} 배당락 D-${u.d} (${fmt.date(u.exDate)})`).join(' · ');
      banner.classList.remove('hidden');
      if ('Notification' in window && Notification.permission==='granted'){
        upcoming.filter(u=>u.d<=1).forEach(u=>{
          const key = 'notified_'+u.ticker+'_'+u.exDate;
          if (!sessionStorage.getItem(key)){
            try{ new Notification('배당락 알림', { body: `${u.ticker} 배당락 D-${u.d} (${fmt.date(u.exDate)})` }); }catch(e){}
            sessionStorage.setItem(key,'1');
          }
        });
      }
    }else{
      banner.classList.add('hidden');
    }
  }

  async function loadExDates(){
    const btn = $('#divUpdateBtn');
    btn.disabled = true; btn.textContent = '갱신중...';
    const from = todayStr();
    const to = addDays(new Date(),90).toISOString().slice(0,10);
    let data = null;
    try{
      const TOKEN = 'demo'; // Finnhub 토큰을 넣으세요
      const url = `https://finnhub.io/api/v1/calendar/dividend?from=${from}&to=${to}&token=${TOKEN}`;
      const res = await fetch(url);
      if (res.ok) data = await res.json();
    }catch(e){}

    if (!data || !data.dividendCalendar){
      const now = new Date();
      data = { dividendCalendar:[
        {symbol:'SCHD', exDate:addDays(now,2).toISOString().slice(0,10)},
        {symbol:'QQQ', exDate:addDays(now,18).toISOString().slice(0,10)},
        {symbol:'META', exDate:addDays(now,47).toISOString().slice(0,10)},
      ]};
    }

    const map = {};
    (data.dividendCalendar||[]).forEach(d=>{ if(d.symbol && d.exDate) map[d.symbol.toUpperCase()] = d.exDate; });
    state.holdings.forEach(h=>{ const ex = map[h.ticker.toUpperCase()]; if(ex) h.exDate = ex; });

    save(); render();
    btn.disabled = false; btn.textContent = '배당일 갱신';
  }

  function bind(){
    $('#krwToggle').onclick = ()=>{ state.krwEnabled=!state.krwEnabled; save(); render(); };
    $('#notifyBtn').onclick = async ()=>{
      if(!('Notification' in window)) return alert('이 브라우저는 알림을 지원하지 않습니다.');
      const p = await Notification.requestPermission();
      alert(p==='granted' ? '알림이 허용되었습니다.' : '알림 권한이 거부되었습니다.');
    };
    $('#divUpdateBtn').onclick = loadExDates;
    $('#calcBtn').onclick = render;
    $('#addBtn').onclick = ()=>{ state.holdings.push({ticker:'',price:0,shares:0,target:0,exDate:null}); save(); render(); };
    $('#resetBtn').onclick = ()=>{ if(confirm('기본 포트폴리오(QQQ/META/SCHD)로 초기화할까요?')){ state = structuredClone(DEFAULT); save(); render(); fetchExchangeRate(); } };
    $('#cashInput').oninput = e=>{ state.cash = +e.target.value||0; render(); };
    $('#minShares').oninput = e=>{ state.minShares = Math.max(1, +e.target.value||1); render(); };

    $('#holdingsTable').addEventListener('input', e=>{
      const el = e.target;
      const i = +el.dataset.i; const k = el.dataset.k;
      if(k!==undefined && !isNaN(i)){
        if(k==='ticker') state.holdings[i][k] = el.value.toUpperCase();
        else state.holdings[i][k] = +el.value||0;
        render();
      }
    });
    $('#holdingsTable').addEventListener('click', e=>{
      const del = e.target.dataset.del;
      if(del!==undefined){ state.holdings.splice(+del,1); save(); render(); }
    });
  }

  document.addEventListener('DOMContentLoaded', ()=>{
    bind();
    updateRateDisplay();
    render();
    fetchExchangeRate();
    updateBanner();
  });
})();
</script>
</body>
</html>
